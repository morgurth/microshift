apiVersion: v1
kind: Service
metadata:
  name: windrose-lan
  namespace: windrose
spec:
  type: ClusterIP
  selector:
    app: windrose
  ports:
  - name: game-udp
    protocol: UDP
    port: 7777
  - name: game-tcp
    protocol: TCP
    port: 7777
  - name: query-udp
    protocol: UDP
    port: 7778
  - name: steam-udp
    protocol: UDP
    port: 27015