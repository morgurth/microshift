apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: ollama
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: ollama.apps.morgurth.com
  to:
    kind: Service
    name: ollama
  port:
    targetPort: proxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect