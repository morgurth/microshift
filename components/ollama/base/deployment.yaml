apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia
      containers:
      # Sidecar: Google OAuth + Bearer Token Gate
      - name: oauth-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
          - --provider=google
          - --http-address=0.0.0.0:4180
          - --upstream=http://127.0.0.1:11434
          - --pass-host-header=false
          - --email-domain=*
          - --authenticated-emails-file=/etc/oauth2-proxy/authenticated_emails
          - --cookie-secure=true
          - --cookie-httponly=true
          - --cookie-samesite=lax
          - --pass-access-token=false
          - --skip-provider-button=true
          - --pass-authorization-header=true
          - --skip-jwt-bearer-tokens=true
          # Extra flag to accept direct Bearer token matching:
          - --extra-jwt-issuers=https://accounts.google.com=ollama
        envFrom:
        - secretRef:
            name: ollama-oauth-secret
        ports:
        - name: proxy
          containerPort: 4180
        volumeMounts:
        - name: auth-emails
          mountPath: /etc/oauth2-proxy

      # Ollama Core
      - name: ollama
        image: docker.io/ollama/ollama:0.5.13
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        # Bind strictly to localhost so unauthenticated traffic inside pod cannot reach it
        - name: OLLAMA_HOST
          value: "127.0.0.1:11434"
        - name: OLLAMA_ORIGINS
          value: "*"
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "10Gi"
            cpu: "4000m"
          requests:
            nvidia.com/gpu: "1"
            memory: "4Gi"
            cpu: "1000m"
        volumeMounts:
        - name: models
          mountPath: /root/.ollama

      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
      - name: auth-emails
        configMap:
          name: ollama-allowed-emails